name: Build DaddyBoard and DaddyBoard GIF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build DaddyBoard (HeliBoard fork)
        working-directory: ./daddyboard-main
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache

      - name: Build DaddyBoard GIF (GifBoard extension)
        working-directory: ./daddyboard-gif
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache

      - name: Upload DaddyBoard APK
        uses: actions/upload-artifact@v4
        with:
          name: DaddyBoard-APK
          path: daddyboard-main/app/build/outputs/apk/debug/*.apk

      - name: Upload DaddyBoard GIF APK
        uses: actions/upload-artifact@v4
        with:
          name: DaddyBoard-GIF-APK
          path: daddyboard-gif/app/build/outputs/apk/debug/*.apk
